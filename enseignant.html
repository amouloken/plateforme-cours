<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace enseignant</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html" data-site-name>Académie</a>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <h1 class="section-title">Espace enseignant</h1>
        <p class="section-sub">Créez vos cours, ajoutez vos leçons vidéo et suivez vos ventes.</p>
        <div id="msg" class="notice hidden"></div>

        <div id="dash" class="dash-layout hidden">
          <div class="dash-list">
            <button type="button" id="new-course" class="btn" style="text-align:center">+ Nouveau cours</button>
            <div id="course-list"></div>
            <div class="card" id="stats" style="padding:18px"></div>
          </div>

          <div class="dash-main">
            <!-- Formulaire du cours -->
            <div class="card">
              <h2 id="form-title" style="margin-top:0">Nouveau cours</h2>
              <form id="course-form" class="form">
                <label>Titre du cours<input name="title" required maxlength="140"></label>
                <label>Adresse de la page (slug)<input name="slug" required pattern="[a-z0-9-]+" placeholder="ex : excel-debutant"></label>
                <label>Sous-titre<input name="subtitle" maxlength="200"></label>
                <label>Description<textarea name="description"></textarea></label>
                <div class="row">
                  <label>Prix en euros (0 = gratuit)<input name="price" type="number" min="0" step="0.01" value="0" required></label>
                  <label>Image de couverture (lien)<input name="cover_url" type="url" placeholder="https://…"></label>
                </div>
                <label class="inline"><input type="checkbox" name="is_published"> Publier le cours (visible dans le catalogue)</label>
                <div style="display:flex;gap:12px;flex-wrap:wrap">
                  <button class="btn" type="submit">Enregistrer le cours</button>
                  <a id="view-course" class="btn btn-outline hidden" target="_blank">Voir la page</a>
                  <button id="delete-course" class="btn btn-danger hidden" type="button">Supprimer</button>
                </div>
              </form>
            </div>

            <!-- Leçons -->
            <div class="card hidden" id="lessons-card">
              <h2 style="margin-top:0">Leçons</h2>
              <table class="table">
                <thead><tr><th>#</th><th>Titre</th><th>Vidéo</th><th></th></tr></thead>
                <tbody id="lesson-rows"></tbody>
              </table>

              <h3 id="lesson-form-title">Ajouter une leçon</h3>
              <form id="lesson-form" class="form">
                <input type="hidden" name="id">
                <div class="row">
                  <label>Titre de la leçon<input name="title" required maxlength="160"></label>
                  <label style="max-width:120px">Ordre<input name="position" type="number" min="1" required></label>
                </div>
                <label>Lien de la vidéo (YouTube, Vimeo, Bunny Stream ou lien .mp4)
                  <input name="video_url" type="url" required placeholder="https://www.youtube.com/watch?v=…">
                </label>
                <p class="muted" id="provider-hint" style="margin:-6px 0 0;font-size:.85rem"></p>
                <div class="row">
                  <label>Durée (minutes)<input name="duration_min" type="number" min="0"></label>
                  <label class="inline" style="align-self:flex-end"><input type="checkbox" name="is_free_preview"> Aperçu gratuit (visible sans achat)</label>
                </div>
                <label>Notes / ressources (facultatif)<textarea name="notes"></textarea></label>
                <div style="display:flex;gap:12px">
                  <button class="btn" type="submit">Enregistrer la leçon</button>
                  <button class="btn btn-outline hidden" type="button" id="cancel-lesson">Annuler</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-year></span> <span data-site-name></span></span>
      <span><a href="mentions-legales.html">Mentions légales &amp; CGV</a></span>
    </div>
  </footer>

  <script type="module">
    import { supabase, renderLayout, requireUser, isTeacher, escapeHtml, formatPrice, slugify, detectProvider, showNotice, $ } from "./assets/app.js";

    const { profile } = await renderLayout();
    const msg = $("#msg");
    const user = supabase ? await requireUser() : null;

    let courses = [];
    let current = null; // cours sélectionné
    let lessons = [];
    const cf = $("#course-form");
    const lf = $("#lesson-form");

    const HINTS = {
      youtube: "YouTube détecté. Attention : une vidéo « non répertoriée » reste accessible à quiconque a le lien.",
      vimeo: "Vimeo détecté. Conseil : limitez l'intégration à votre domaine dans les réglages de confidentialité Vimeo.",
      bunny: "Bunny Stream détecté. Conseil : activez la protection par domaine autorisé.",
      other: "Lien direct ou autre plateforme.",
    };

    if (user) {
      if (!isTeacher(profile)) {
        showNotice(msg, "Votre compte n'a pas encore le rôle enseignant. Voir l'étape « Devenir enseignant » dans LISEZMOI.md.", "warn");
      } else {
        $("#dash").classList.remove("hidden");
        await loadCourses();
        selectCourse(courses[0] || null);
        loadStats();
      }
    }

    async function loadCourses() {
      const { data, error } = await supabase.from("courses").select("*").eq("teacher_id", user.id).order("created_at");
      if (error) return showNotice(msg, error.message, "error");
      courses = data;
      $("#course-list").innerHTML = courses.map((c) => `
        <button type="button" data-id="${c.id}" class="${current?.id === c.id ? "active" : ""}" style="width:100%;margin-bottom:8px">
          <strong>${escapeHtml(c.title)}</strong><br>
          <span class="badge ${c.is_published ? "badge-success" : "badge-muted"}">${c.is_published ? "Publié" : "Brouillon"}</span>
          <span class="muted" style="font-size:.85rem"> ${formatPrice(c.price_cents, c.currency)}</span>
        </button>`).join("");
      document.querySelectorAll("#course-list button").forEach((b) =>
        b.addEventListener("click", () => selectCourse(courses.find((c) => c.id === b.dataset.id))));
    }

    async function loadStats() {
      const { data: sales = [] } = await supabase.from("purchases").select("amount_cents, teacher_amount_cents, status").eq("teacher_id", user.id).eq("status", "paid");
      const { count } = await supabase.from("enrollments").select("id, course:courses!inner(teacher_id)", { count: "exact", head: true }).eq("course.teacher_id", user.id);
      const total = sales.reduce((s, p) => s + p.amount_cents, 0);
      $("#stats").innerHTML = `<strong>Statistiques</strong>
        <p style="margin:8px 0 0">Élèves inscrits : <strong>${count ?? 0}</strong></p>
        <p style="margin:4px 0 0">Ventes : <strong>${sales.length}</strong> · ${formatPrice(total) === "Gratuit" ? "0 €" : formatPrice(total)}</p>`;
    }

    function selectCourse(course) {
      current = course;
      cf.reset();
      document.querySelectorAll("#course-list button").forEach((b) => b.classList.toggle("active", b.dataset.id === course?.id));
      $("#form-title").textContent = course ? "Modifier le cours" : "Nouveau cours";
      $("#delete-course").classList.toggle("hidden", !course);
      $("#view-course").classList.toggle("hidden", !course);
      $("#lessons-card").classList.toggle("hidden", !course);
      cf.slug.dataset.touched = course ? "1" : "";
      if (course) {
        cf.title.value = course.title;
        cf.slug.value = course.slug;
        cf.subtitle.value = course.subtitle || "";
        cf.description.value = course.description || "";
        cf.price.value = (course.price_cents / 100).toFixed(2);
        cf.cover_url.value = course.cover_url || "";
        cf.is_published.checked = course.is_published;
        $("#view-course").href = "cours.html?c=" + encodeURIComponent(course.slug);
        loadLessons();
      }
    }

    cf.title.addEventListener("input", () => { if (!cf.slug.dataset.touched) cf.slug.value = slugify(cf.title.value); });
    cf.slug.addEventListener("input", () => (cf.slug.dataset.touched = "1"));
    $("#new-course").addEventListener("click", () => selectCourse(null));

    cf.addEventListener("submit", async (e) => {
      e.preventDefault();
      const row = {
        teacher_id: user.id,
        title: cf.title.value.trim(),
        slug: slugify(cf.slug.value),
        subtitle: cf.subtitle.value.trim() || null,
        description: cf.description.value.trim() || null,
        price_cents: Math.round(parseFloat(cf.price.value || "0") * 100),
        cover_url: cf.cover_url.value.trim() || null,
        is_published: cf.is_published.checked,
      };
      const q = current
        ? supabase.from("courses").update(row).eq("id", current.id).select().single()
        : supabase.from("courses").insert(row).select().single();
      const { data, error } = await q;
      if (error) return showNotice(msg, error.code === "23505" ? "Cette adresse (slug) est déjà utilisée par un autre cours." : error.message, "error");
      showNotice(msg, "Cours enregistré.", "success");
      current = data;
      await loadCourses();
      selectCourse(data);
    });

    $("#delete-course").addEventListener("click", async () => {
      if (!current || !confirm(`Supprimer définitivement « ${current.title} » et toutes ses leçons ?`)) return;
      const { error } = await supabase.from("courses").delete().eq("id", current.id);
      if (error) return showNotice(msg, "Suppression impossible : " + (error.code === "23503" ? "ce cours a déjà des élèves inscrits, dépubliez-le plutôt (décochez « Publier »)." : error.message), "error");
      showNotice(msg, "Cours supprimé.", "success");
      current = null;
      await loadCourses();
      selectCourse(courses[0] || null);
    });

    // ---------- Leçons ----------
    async function loadLessons() {
      const { data = [] } = await supabase.from("lessons").select("*, lesson_videos(video_url)").eq("course_id", current.id).order("position");
      lessons = data;
      $("#lesson-rows").innerHTML = lessons.length ? lessons.map((l) => {
        const url = l.lesson_videos?.video_url || "";
        return `<tr>
          <td>${l.position}</td>
          <td>${escapeHtml(l.title)} ${l.is_free_preview ? '<span class="badge">Aperçu</span>' : ""}</td>
          <td><span class="badge badge-muted">${detectProvider(url)}</span></td>
          <td style="white-space:nowrap">
            <button class="btn btn-outline btn-small" data-edit="${l.id}">Modifier</button>
            <button class="btn btn-danger btn-small" data-del="${l.id}">✕</button>
          </td></tr>`;
      }).join("") : `<tr><td colspan="4" class="muted">Aucune leçon pour l'instant.</td></tr>`;
      document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => editLesson(lessons.find((l) => l.id === b.dataset.edit))));
      document.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => deleteLesson(b.dataset.del)));
      editLesson(null);
    }

    function editLesson(l) {
      lf.reset();
      lf.id.value = l?.id || "";
      $("#lesson-form-title").textContent = l ? "Modifier la leçon" : "Ajouter une leçon";
      $("#cancel-lesson").classList.toggle("hidden", !l);
      lf.position.value = l ? l.position : (lessons.at(-1)?.position || 0) + 1;
      if (l) {
        lf.title.value = l.title;
        lf.video_url.value = l.lesson_videos?.video_url || "";
        lf.duration_min.value = l.duration_min ?? "";
        lf.is_free_preview.checked = l.is_free_preview;
        lf.notes.value = l.notes || "";
        lf.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      updateHint();
    }
    $("#cancel-lesson").addEventListener("click", () => editLesson(null));

    function updateHint() { $("#provider-hint").textContent = lf.video_url.value ? HINTS[detectProvider(lf.video_url.value)] : ""; }
    lf.video_url.addEventListener("input", updateHint);

    lf.addEventListener("submit", async (e) => {
      e.preventDefault();
      const row = {
        course_id: current.id,
        title: lf.title.value.trim(),
        position: parseInt(lf.position.value, 10),
        duration_min: lf.duration_min.value ? parseInt(lf.duration_min.value, 10) : null,
        is_free_preview: lf.is_free_preview.checked,
        notes: lf.notes.value.trim() || null,
      };
      const id = lf.id.value;
      const { data, error } = id
        ? await supabase.from("lessons").update(row).eq("id", id).select().single()
        : await supabase.from("lessons").insert(row).select().single();
      if (error) return showNotice(msg, error.message, "error");

      const { error: vErr } = await supabase.from("lesson_videos")
        .upsert({ lesson_id: data.id, video_url: lf.video_url.value.trim() });
      if (vErr) return showNotice(msg, "Leçon enregistrée mais pas la vidéo : " + vErr.message, "error");

      showNotice(msg, "Leçon enregistrée.", "success");
      loadLessons();
    });

    async function deleteLesson(id) {
      if (!confirm("Supprimer cette leçon ?")) return;
      const { error } = await supabase.from("lessons").delete().eq("id", id);
      if (error) return showNotice(msg, error.message, "error");
      loadLessons();
    }
  </script>
</body>
</html>
